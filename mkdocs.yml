site_name: Avaliação dos Serviços — Portal MS
site_description: Estudo estratégico da SETDIG sobre como o Portal de Serviços do MS vai avaliar seus serviços digitais junto ao cidadão.
site_author: SETDIG — Secretaria-Executiva de Transformação Digital
site_url: https://fabioramos-02.github.io/avaliacao-de-servicos/

docs_dir: docs

theme:
  name: material
  language: pt-BR

  logo: assets/img/segov-logo.svg
  favicon: assets/img/brasao-ms.svg
  font: false

  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Modo escuro

    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Modo claro

  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - assets/css/segov.css

extra:
  generator: false

  social:
    - icon: material/web
      link: https://www.setdig.ms.gov.br/
      name: SETDIG

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables

  - toc:
      permalink: true

  - pymdownx.details

  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.tabbed:
      alternate_style: true

  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji

nav:
  - Início: index.md
  - 1. Contexto: 01-contexto.md
  - 2. Referência: 02-referencia.md
  - 3. Modelo proposto: 03-modelo-proposto.md
  - 4. Dados e privacidade: 04-dados-e-privacidade.md
  - 5. Indicadores: 05-indicadores.md
  - 6. Validação: 06-validacao.md
  - 7. Recomendação: 07-recomendacao.md
  - Fontes: pesquisa/fontes.md
